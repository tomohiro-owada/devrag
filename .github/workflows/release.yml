name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: devrag-macos-intel
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: devrag-macos-apple-silicon
          # Linux builds
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: devrag-linux-x64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary_name: devrag-linux-arm64
          # Windows builds
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: devrag-windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up MSYS2 and dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Install MSYS2 packages using chocolatey's msys2
          C:/msys64/usr/bin/pacman.exe -Syu --noconfirm
          C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-sqlite3

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export PATH="C:/msys64/mingw64/bin:$PATH"

          # Copy only sqlite3 headers to a dedicated directory to avoid
          # header collisions (MSYS2's parser.h vs tree-sitter's parser.h).
          mkdir -p _cgo_includes
          cp C:/msys64/mingw64/include/sqlite3.h _cgo_includes/
          cp C:/msys64/mingw64/include/sqlite3ext.h _cgo_includes/ 2>/dev/null || true

          export CGO_CFLAGS="-I$(pwd)/_cgo_includes"
          export CGO_LDFLAGS="-LC:/msys64/mingw64/lib"

          go build -ldflags="-s -w" -o ${{ matrix.binary_name }} cmd/main.go

      - name: Download ONNX Runtime (macOS)
        if: matrix.goos == 'darwin'
        run: |
          ORT_VERSION="1.22.0"
          ORT_ARCH="${{ matrix.goarch }}"
          if [ "$ORT_ARCH" = "amd64" ]; then
            ORT_ARCH="x86_64"
          fi
          ORT_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${ORT_ARCH}-${ORT_VERSION}.tgz"
          echo "Downloading ONNX Runtime from ${ORT_URL}"
          curl -sL "$ORT_URL" -o /tmp/onnxruntime.tgz
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          cp /tmp/onnxruntime-osx-${ORT_ARCH}-${ORT_VERSION}/lib/libonnxruntime.${ORT_VERSION}.dylib ./libonnxruntime.dylib
          echo "Bundled libonnxruntime.dylib ($(du -h libonnxruntime.dylib | cut -f1))"
        shell: bash

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goarch }}" = "arm64" ] && [ "${{ matrix.goos }}" = "linux" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          go build -ldflags="-s -w" -o ${{ matrix.binary_name }} cmd/main.go
        shell: bash

      - name: Create tarball (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # Include bundled ONNX Runtime dylib for macOS
          BUNDLE_FILES="${{ matrix.binary_name }}"
          if [ -f libonnxruntime.dylib ]; then
            BUNDLE_FILES="$BUNDLE_FILES libonnxruntime.dylib"
          fi
          tar -czf ${{ matrix.binary_name }}.tar.gz $BUNDLE_FILES
          shasum -a 256 ${{ matrix.binary_name }}.tar.gz > ${{ matrix.binary_name }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath ${{ matrix.binary_name }}.zip
          (Get-FileHash -Algorithm SHA256 ${{ matrix.binary_name }}.zip).Hash | Out-File -FilePath ${{ matrix.binary_name }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ${{ matrix.binary_name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
